<!<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HBD Sayyid Maksiliyanus Arridwan</title>
    <style>
        body {
            background-color: #0d0d0d;
            color: #e0e0e0;
            font-family: 'Courier New', Courier, monospace;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }

        /* Kontainer bergaya layar terminal/video ketik */
        .terminal-box {
            width: 100%;
            max-width: 600px;
            background-color: #16161a;
            padding: 25px;
            border-radius: 8px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            border: 1px solid #2c2c35;
            min-height: 200px;
            position: relative;
        }

        #terminal {
            white-space: pre-wrap;
            word-wrap: break-word;
            line-height: 1.8;
            font-size: 1.2rem;
            display: inline;
        }

        /* Warna teks khusus untuk variasi ucapan */
        .teks-putih { color: #ffffff; font-weight: bold; }
        .teks-hijau { color: #4caf50; }
        .teks-kuning { color: #ffeb3b; }

        /* Gaya kursor ketik vertikal */
        .cursor {
            display: inline-block;
            width: 8px;
            height: 19px;
            background-color: #4caf50;
            margin-left: 5px;
            animation: blink 0.75s step-end infinite;
            vertical-align: middle;
        }

        @keyframes blink {
            from, to { background-color: transparent }
            50% { background-color: #4caf50; }
        }
    </style>
</head>
<body>

    <div class="terminal-box">
        <!-- Tempat teks akan diketik otomatis -->
        <div id="terminal"></div><span id="cursor" class="cursor"></span>
    </div>

    <script>
        // Data ucapan (Bisa ditambah atau diubah sesukamu)
        const teksLengkap = [
            { teks: "> Menghubungi server...\n", kelas: "teks-hijau" },
            { teks: "> Mengirimkan doa terbaik...\n\n", kelas: "teks-hijau" },
            { teks: "Happy Birthday, Sayyid Maksiliyanus Arridwan! ✨\n", kelas: "teks-putih" },
            { teks: "Wishing you a year filled with love, laughter, and endless blessings. Semoga semua impianmu tercapai! 🎂🎉", kelas: "teks-kuning" }
        ];

        let urutanTeks = 0;
        let urutanKarakter = 0;
        const terminal = document.getElementById('terminal');

        function ketikVideo() {
            if (urutanTeks < teksLengkap.length) {
                const bagianAktif = teksLengkap[urutanTeks];

                // Membuat baris baru dengan warna kelas masing-masing
                if (urutanKarakter === 0) {
                    const spanBaru = document.createElement('span');
                    spanBaru.className = bagianAktif.kelas;
                    spanBaru.id = 'span-' + urutanTeks;
                    terminal.appendChild(spanBaru);
                }

                const spanTarget = document.getElementById('span-' + urutanTeks);
                spanTarget.textContent += bagianAktif.teks.charAt(urutanKarakter);

                urutanKarakter++;

                if (urutanKarakter < bagianAktif.teks.length) {
                    setTimeout(ketikVideo, 40); // Kecepatan mengetik per huruf
                } else {
                    urutanKarakter = 0;
                    urutanTeks++;
                    setTimeout(ketikVideo, 500); // Jeda sebelum lanjut ke baris baru
                }
            } else {
                // Kursor berhenti berkedip/hilang setelah selesai mengetik
                document.getElementById('cursor').style.animation = 'none';
                document.getElementById('cursor').style.backgroundColor = 'transparent';
            }
        }

        // Jalankan fungsi setelah 1 detik halaman dimuat
        window.onload = () => {
            setTimeout(ketikVideo, 1000);
        };
    </script>

</body>
</html>
